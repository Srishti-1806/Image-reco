events {}
http {
  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.3;                       # TLS 1.3 only
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;                        # mTLS: only enrolled devices

    client_max_body_size 64k;

    location / {
      proxy_pass http://core:8000;
      # Overwrites anything the client sent; app trusts these ONLY because
      # the core container is unreachable except through this gateway.
      proxy_set_header X-Client-CN     $ssl_client_s_dn_cn;
      proxy_set_header X-Client-Verify $ssl_client_verify;
    }
  }
}
